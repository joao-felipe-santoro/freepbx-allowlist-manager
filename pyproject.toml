[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freepbx-allowlist-system"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=20.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
allowlist-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
